<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Control System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Phosphor Icons for premium SVG icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- LocalForage for easy IndexedDB usage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- Export/Import Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo-area">
                <i class="ph ph-trend-up"></i>
                <span>BizControl</span>
            </div>

            <ul class="nav-links">
                <li class="active" data-view="dashboard" onclick="navigateTo('dashboard')">
                    <i class="ph ph-squares-four"></i>
                    <span>Resumen</span>
                </li>
                <li data-view="pos" onclick="navigateTo('pos')">
                    <i class="ph ph-shopping-cart"></i>
                    <span>Venta</span>
                </li>
                <li data-view="daily-records" onclick="navigateTo('daily-records')">
                    <i class="ph ph-list-dashes"></i>
                    <span>Registros Diarios</span>
                </li>
                <li data-view="cash-control" onclick="navigateTo('cash-control')">
                    <i class="ph ph-money"></i>
                    <span>Control Efectivo</span>
                </li>

                <li data-view="inventory" onclick="navigateTo('inventory')">
                    <i class="ph ph-warehouse"></i>
                    <span>Inventario</span>
                </li>
                <li data-view="settings" onclick="navigateTo('settings')">
                    <i class="ph ph-gear"></i>
                    <span>Configuración</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Resumen y Análisis</h1>
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <div id="notifBtn" class="notification-bell">
                        <i class="ph ph-bell"></i>
                        <span id="notif-count" class="notif-badge">0</span>
                    </div>
                    <div id="notifDropdown" class="notif-dropdown">
                        <!-- Notifications content will be injected here -->
                    </div>
                    <div class="user-profile" id="userProfileBtn" onclick="toggleUserMenu(event)">
                        <div class="avatar">A</div>
                        <span>Admin</span>
                        <i class="ph ph-caret-down"></i>

                        <div id="userDropdown" class="user-dropdown">
                            <div class="dropdown-item" onclick="navigateTo('settings')">
                                <i class="ph ph-gear"></i> Configuración
                            </div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item logout-item" onclick="logout()">
                                <i class="ph ph-sign-out"></i> Cerrar Sesión
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div id="content-area" class="content-zoom">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="incidentModal" class="modal-overlay static-modal hidden">
        <div class="biz-modal large"
            style="background: var(--bg-card); color: var(--text); border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 600px; padding: 2rem;">
            <div class="modal-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="margin: 0;"><i class="ph ph-warning-circle" style="color: var(--danger);"></i> Registrar
                    Merma / Devolución</h3>
                <button onclick="closeModal('incidentModal')" class="close-icon"
                    style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="type-selector" style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Tipo de Incidencia</label>
                    <select id="incidentType" onchange="updateIncidentUI()" class="biz-input"
                        style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white;">
                        <option value="refund_broken">1. Merma: Devolución Cliente (Roto)</option>
                        <option value="refund_good">2. Devolución Cliente (Buen estado)</option>
                        <option value="internal_loss">3. Merma: Rotura / Deterioro Interno</option>
                    </select>
                </div>

                <p id="incidentInfo" class="info-box"
                    style="background: rgba(88, 166, 255, 0.1); padding: 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; border: 1px solid rgba(88, 166, 255, 0.2);">
                </p>

                <div style="margin-bottom: 1.5rem; position: relative;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Buscar Producto (Escribe el
                        nombre)</label>
                    <div style="position: relative;">
                        <input type="text" id="incidentProductSearch" oninput="handleIncidentSearch(this.value)"
                            class="biz-input" placeholder="Ej: Taza..." autocomplete="off"
                            style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white; padding-left: 2.5rem;">
                        <i class="ph ph-magnifying-glass"
                            style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    </div>
                    <div id="incident-search-results"
                        style="position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card); z-index: 100; border-radius: 8px; border: 1px solid var(--border); max-height: 200px; overflow-y: auto; display: none; box-shadow: var(--shadow-premium);">
                    </div>
                </div>

                <div id="product-preview-card" style="margin-bottom: 1.5rem; display: none;">
                    <!-- Product card details will be injected here -->
                </div>

                <div class="split-inputs"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Cant.</label>
                        <input type="number" id="incidentQty" value="1" min="1" class="biz-input"
                            style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white;">
                    </div>
                    <div id="moneyGroup">
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Devolver ($)</label>
                        <input type="number" id="incidentAmount" placeholder="0.00" class="biz-input"
                            style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white;">
                    </div>
                </div>

                <div style="margin-bottom:1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Evidencia Fotográfica (Max
                        5)</label>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                        <i class="ph ph-info"></i> Tome varias fotos desde distintos ángulos para documentar el estado.
                    </p>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="photo-preview-container">
                        <label class="photo-upload-btn"
                            style="width: 60px; height: 60px; border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: var(--transition);">
                            <i class="ph ph-camera" style="font-size: 1.5rem;"></i>
                            <input type="file" accept="image/*" multiple onchange="handleIncidentPhotos(this)"
                                style="display: none;" id="incidentPhotos">
                        </label>
                    </div>
                </div>

                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Motivo (Obligatorio)</label>
                <textarea id="incidentReason" class="biz-input" rows="2"
                    style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white; resize: vertical; min-height: 60px;"></textarea>
            </div>
            <div class="modal-footer" style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="biz-btn outline" onclick="closeModal('incidentModal')"
                    style="flex: 1; padding: 0.75rem; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer;">Cancelar</button>
                <button class="biz-btn danger" onclick="processIncident()"
                    style="flex: 2; padding: 0.75rem; background: var(--danger); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">REGISTRAR
                    MERMA / OPERACIÓN</button>
            </div>
        </div>
    </div>

    <div id="fab-container" class="fab-container">
        <button id="main-fab" class="fab-main hidden" onclick="handleFabAction()">
            <i class="ph ph-plus"></i>
        </button>
    </div>

    <!-- Debugger (Hotfix request) -->
    <script src="js/debug_overlay.js?v=1"></script>

    <!-- Core Logic -->
    <script src="firebase-config.js?v=10.1"></script>
    <script src="js/core/security.js?v=10.3"></script>
    <script src="js/modules/pos.js?v=10.22"></script>
    <script src="js/modules/inventory.js?v=11.6"></script>
    <script src="js/modules/users.js?v=1.2"></script>
    <script src="js/modules/transfer.js?v=1.1"></script>
    <script src="js/modules/business_network.js?v=2.4"></script>
    <script src="js/initial_data.js?v=2"></script>
    <script src="data.js?v=10.12"></script>
    <script src="app.js?v=10.27"></script>
</body>

</html>
